{% extends 'base.html' %}

{% block title %}Восстановление пароля — Сервис рассылок{% endblock %}

{% block content %}
<h1 class="mb-3">Восстановление пароля</h1>

<form method="post" class="card card-body" style="max-width: 520px;">
  {% csrf_token %}
  {{ form.non_field_errors }}

  <div class="mb-3">
    <label class="form-label" for="id_email">Email</label>
    {{ form.email }}
    <div class="text-danger">{{ form.email.errors }}</div>
  </div>

  <button class="btn btn-primary" type="submit">Отправить ссылку</button>
</form>
{% endblock %}
